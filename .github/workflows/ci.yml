name: Vérifications
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Playwright 1.56.1 ne prend pas en charge Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Vérifier l'absence de fichiers suivis > 10 Mo
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const { statSync } = require("node:fs");
            const fichiers = execSync("git ls-files", { encoding: "utf8" }).trim().split("\n").filter(Boolean);
            const tropGros = fichiers.filter((f) => {
              try { return statSync(f).size > 10 * 1024 * 1024; } catch { return false; }
            });
            if (tropGros.length) {
              console.error("Fichiers suivis dépassant 10 Mo :", tropGros);
              process.exit(1);
            }
          '
      - name: Vérification TypeScript
        run: npx tsc --noEmit
      # Lint JavaScript uniquement (voir eslint.config.mjs) : TypeScript 7 n'est pas
      # supporté par typescript-eslint, les .ts restent couverts par tsc + les tests.
      # Décision de sprint : NON bloquant — on l'affiche sans bloquer la fusion.
      - name: Lint (non bloquant)
        run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build
      - run: node scripts/verifier-drills.mjs
      - run: node scripts/verifier-hors-ligne.mjs
      # Smoke test de ce qui est réellement servi : build-id, worker, types, budget de poids.
      # Comble le trou « vite build passe alors que tsc -b n'a jamais tourné » (Vercel).
      - run: npm run verifier:deploiement
      # 9.2 — le README ne peut plus mentir sur ses chiffres.
      - run: npm run verifier:metriques
      # 7.3.3 — parité RLS. Sans SUPABASE_DB_URL, le script sort en 2 et le dit :
      # il ne prétend jamais avoir vérifié une base qu'il n'a pas interrogée.
      - name: Parité RLS (si SUPABASE_DB_URL fourni)
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            npm run verifier:parite-rls
          else
            echo "SUPABASE_DB_URL absent : parité NON vérifiée (témoin figé seulement)."
            node scripts/verifier-parite-rls.mjs --fichier supabase/tests/fixtures/parite-rls-2026-11-22.json
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - run: npm audit --audit-level=high
      - name: Installer les dépendances du laboratoire
        run: npm ci --no-audit --no-fund
        working-directory: modules/boussole
      - name: Vérifier et reconstruire le HTML autonome
        run: |
          sha256sum public/boussole/index.html > /tmp/boussole-html.sha256
          npm --prefix modules/boussole run typecheck
          npm --prefix modules/boussole run build
          sha256sum --check /tmp/boussole-html.sha256
          npm run verifier:inventaire-boussole
      - name: Mettre en cache les navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('modules/boussole/package-lock.json') }}
      - name: Installer Chromium pour les tests locaux
        run: |
          if npx playwright install --with-deps chromium > /tmp/boussole-chromium-install.log 2>&1; then
            cat /tmp/boussole-chromium-install.log
          else
            cat /tmp/boussole-chromium-install.log
            node -e '
              const fs = require("fs");
              const lignes = fs.readFileSync("/tmp/boussole-chromium-install.log", "utf8").trim().split("\n").slice(-15);
              const message = lignes.join("\n").replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
              console.log("::error title=Installation Chromium::" + message);
            '
            exit 1
          fi
        working-directory: modules/boussole
      - name: Tester le laboratoire autonome
        run: npm test
        working-directory: modules/boussole
      - name: Tester l'intégration sur le build local
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4182 --strictPort > /tmp/boussole-preview.log 2>&1 &
          serveur=$!
          trap 'kill "$serveur" 2>/dev/null || true' EXIT
          node -e '
            async function attendre() {
              for (let i = 0; i < 60; i++) {
                try { if ((await fetch("http://127.0.0.1:4182/")).ok) return; } catch {}
                await new Promise(resolve => setTimeout(resolve, 500));
              }
              throw new Error("Le serveur local n’a pas démarré.");
            }
            attendre().catch(e => { console.error(e); process.exitCode = 1; });
          '
          cd modules/boussole
          APP_URL=http://127.0.0.1:4182 npm run test:integration
