  <script>
    /* Garde-fou : si un script casse, on affiche la raison au lieu d'un écran vide. */
    (function () {
      function afficher(msg) {
        try {
          var ecran = document.getElementById("ecran");
          if (!ecran) return;
          var texte = String(msg).slice(0, 600);
          if (ecran.querySelector(".amorce")) {
            ecran.innerHTML =
              '<div class="panne" role="alert">' +
              '<p class="panne__t">ما قدرناش نحمّلو الشاشة</p>' +
              '<p class="panne__n">عاود التحميل، وإذا بقى نفس الشيء صفّر الحالة من لوحة الاختبار.</p>' +
              '<pre class="panne__trace"></pre>' +
              '<button class="btn btn--secondaire" type="button" onclick="location.reload()">عاود التحميل</button>' +
              "</div>";
            ecran.querySelector(".panne__trace").textContent = texte;
            return;
          }
          if (document.getElementById("panne-bandeau")) return;
          var b = document.createElement("div");
          b.id = "panne-bandeau";
          b.className = "panne-bandeau";
          b.setAttribute("role", "alert");
          b.textContent = "خطأ: " + texte.slice(0, 180);
          document.body.appendChild(b);
        } catch (e) {
          /* rien de plus à faire */
        }
      }
      window.addEventListener("error", function (ev) {
        afficher((ev.message || "خطأ") + " @" + (ev.filename || "?") + ":" + (ev.lineno || "?"));
      });
      window.addEventListener("unhandledrejection", function (ev) {
        afficher("Promise: " + ((ev.reason && ev.reason.message) || ev.reason));
      });
    })();
  </script>
</head>
<body data-vue="onboarding">
